<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-worldwind demo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%230ea5e9%27/%3E%3Cpath d=%27M16 2a14 14 0 0 1 0 28M2 16h28M5 8h22M5 24h22%27 stroke=%27%23052e16%27 stroke-width=%271.5%27 fill=%27none%27/%3E%3C/svg%3E" />
    <style>
      html, body, #root { margin: 0; height: 100%; background: #000; }
      /* demo layout: stack panels that share a corner */
      .wwui-panel.wwui-panel--below-goto { top: 110px; }
      .wwui-panel.wwui-panel--beside-nav { right: 64px; }
      .wwui-panel.wwui-panel--above-coords { bottom: 64px; }

      /* demo layout on phones: fewer panels, no overlaps */
      @media (max-width: 720px) {
        .wwui-panel.wwui-panel--beside-nav,
        .wwui-panel.wwui-panel--above-coords { display: none; }
        .wwui-panel.wwui-panel--below-goto { top: 96px; }
        .wwui-panel.wwui-panel--bottom-right { bottom: 84px; max-width: 60vw; }
      }
            
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
