version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Angular 22 and ng-packagr 22 require TypeScript >=6.0 <6.1, so a TypeScript major
      # can only move together with an Angular release that supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      angular:
        patterns: ['@angular/*', 'ng-packagr', '@analogjs/*']
      vite:
        patterns: ['vite', 'vitest', '@vitejs/*', 'tsup', 'jsdom', '@playwright/test']
      minor-and-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
